name: CI with Docker
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run Go Vet
        run: go vet ./...

      - name: Test
        run: go test -v -tags=integration -count=1 -timeout=10m ./...

  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: docker build -t postfeed:local .

      - name: Start container
        run: |
            docker run -d \
              --name app-container \
              -p 127.0.0.0:8081:8080 \
              postfeed:local

      - name: Wait for initialization
        shell: bash
        run: |
                  deadline=$((SECONDS + 60))
                  
                  while (( SECONDS < deadline )); do
                    running=$(docker inspect \
                      --format '{{.State.Running}}' app-container)
                  
                    if [[ "$running" != "true" ]]; then
                      echo "Container exited before becoming ready"
                      exit 1
                    fi
                  
                    if status=$(curl --silent --show-error \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      --connect-timeout 1 \
                      --max-time 2 \
                      http://127.0.0.0:8081/playground); then
                      if [[ "$status" == "200" ]]; then
                        echo "Application is ready"
                        exit 0
                      fi
                    fi
                  
                    sleep 1
                  done
                  
                  echo "Application did not become ready within timeout"
                  exit 1

      - name: Show container diagnostics
        if: always()
        run: |
          docker inspect --format '{{json .State}}' app-container || true
          docker logs --timestamps app-container 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
            docker stop app-container || true
            docker rm app-container || true

  postgres:
    name: Application with PostgreSQL
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    env:
      STORAGE_TYPE: psql
      GRAPHQL_URL: http://127.0.0.0:8081/query
      TEST_USER_ID: 47c52a73-c599-4c34-86cb-4969bfc0e730

    steps:
        - name: Checkout
          uses: actions/checkout@v5

        - name: Prepare CI environment
          shell: bash
          run: |
              cat > .env <<'EOF'
              APP_PORT=8081
              
              POSTGRES_USER=app
              POSTGRES_PASSWORD=ci_password
              POSTGRES_DB=posts
              
              DATABASE_URL=postgres://app:ci_password@postgres:5432/posts?sslmode=disable
              
              DATABASE_MAX_OPEN_CONNS=25
              DATABASE_MAX_IDLE_CONNS=25
              DATABASE_CONN_MAX_LIFETIME=5m
              EOF

        - name: Start application and PostgreSQL
          run: |
                  docker compose --profile psql up \
                    --build \
                    --wait \
                    --wait-timeout 120

        - name: Check PostgreSQL through GraphQL
          run: bash scripts/ci/check-postgres-api.sh

        - name: Show diagnostics
          if: always()
          run: |
                  docker compose --profile psql ps --all || true
                  docker compose --profile psql logs \
                    --no-color --timestamps || true

        - name: Cleanup
          if: always()
          run: |
                  docker compose --profile psql down \
                    --volumes \
                    --remove-orphans
